[project]
name = "fastapi-delivery-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "cryptography>=46.0.5",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "redis>=7.4.0",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
